<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contoh Formulir</title>
</head>
<body>
    <form action="kartu.html" method="get" id="formDaftar" name="formDaftar" class="kartu">

        <!-- ===== Data Pribadi ===== -->
        <fieldset>
            <legend>
                <span class="ikon-user">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"></path>
                    </svg>
                </span>
                Data Pribadi
            </legend>

            <label for="nama">Nama Lengkap:</label>
            <input
                type="text"
                id="nama"
                name="nama"
                class="form-control"
                placeholder="Masukkan nama lengkap Anda"
                required
                minlength="3">

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="contoh@email.com"
                required>

            <label for="hp">No. HP:</label>
            <div class="input-hp">
                <select id="kode-negara" name="kode_negara" class="form-control" aria-label="Kode negara"></select>
                <input
                    type="tel"
                    id="hp"
                    name="hp"
                    class="form-control"
                    placeholder="81234567890"
                    inputmode="numeric"
                    pattern="[0-9]{6,14}"
                    minlength="6"
                    maxlength="14"
                    title="Hanya angka, 6 sampai 14 digit"
                    required>
            </div>
            <small id="pesan-hp" class="pesan-error" aria-live="polite"></small>
        </fieldset>

        <!-- ===== Informasi Tambahan ===== -->
        <fieldset>
            <legend>Informasi Tambahan</legend>

            <label for="prodi">Program Studi:</label>
            <select id="prodi" name="prodi" class="form-control" required>
                <option value="">-- Pilih Program Studi --</option>
                <option value="si">Sistem Informasi</option>
                <option value="ti">Teknik Informatika</option>
                <option value="bd">Bisnis Digital</option>
            </select>

            <p class="judul-label" id="judul-arah">Arah Coding:</p>
            <div role="group" aria-labelledby="judul-arah">
                <label class="pilihan">
                    <input type="checkbox" name="arah[]" value="website"> Website
                </label>
                <label class="pilihan">
                    <input type="checkbox" name="arah[]" value="gamedev"> Game Development
                </label>
                <label class="pilihan">
                    <input type="checkbox" name="arah[]" value="cyber"> Cybersecurity
                </label>
            </div>

            <label for="pesan">Pesan:</label>
            <textarea
                id="pesan"
                name="pesan"
                class="form-control"
                rows="4"
                cols="50"
                placeholder="Tulis pesan Anda di sini..."></textarea>
        </fieldset>

        <!-- ===== Tombol ===== -->
        <div class="aksi">
            <button type="submit" id="tombol-kirim">Kirim</button>
            <button type="reset" id="tombol-reset"><span class="ikon">↻</span> Reset</button>
        </div>

    </form>

    <script>
        // ===== Daftar kode negara =====
        const negara = [
            ["Afghanistan", "+93"], ["Albania", "+355"], ["Algeria", "+213"], ["Andorra", "+376"],
            ["Angola", "+244"], ["Argentina", "+54"], ["Armenia", "+374"], ["Australia", "+61"],
            ["Austria", "+43"], ["Azerbaijan", "+994"], ["Bahrain", "+973"], ["Bangladesh", "+880"],
            ["Belarus", "+375"], ["Belgium", "+32"], ["Bolivia", "+591"], ["Bosnia and Herzegovina", "+387"],
            ["Brazil", "+55"], ["Brunei", "+673"], ["Bulgaria", "+359"], ["Cambodia", "+855"],
            ["Cameroon", "+237"], ["Canada", "+1"], ["Chile", "+56"], ["China", "+86"],
            ["Colombia", "+57"], ["Costa Rica", "+506"], ["Croatia", "+385"], ["Cuba", "+53"],
            ["Cyprus", "+357"], ["Czech Republic", "+420"], ["Denmark", "+45"], ["Ecuador", "+593"],
            ["Egypt", "+20"], ["Estonia", "+372"], ["Ethiopia", "+251"], ["Fiji", "+679"],
            ["Finland", "+358"], ["France", "+33"], ["Georgia", "+995"], ["Germany", "+49"],
            ["Ghana", "+233"], ["Greece", "+30"], ["Guatemala", "+502"], ["Hong Kong", "+852"],
            ["Hungary", "+36"], ["Iceland", "+354"], ["India", "+91"], ["Indonesia", "+62"],
            ["Iran", "+98"], ["Iraq", "+964"], ["Ireland", "+353"], ["Israel", "+972"],
            ["Italy", "+39"], ["Japan", "+81"], ["Jordan", "+962"], ["Kazakhstan", "+7"],
            ["Kenya", "+254"], ["Kuwait", "+965"], ["Kyrgyzstan", "+996"], ["Laos", "+856"],
            ["Latvia", "+371"], ["Lebanon", "+961"], ["Libya", "+218"], ["Liechtenstein", "+423"],
            ["Lithuania", "+370"], ["Luxembourg", "+352"], ["Macau", "+853"], ["Madagascar", "+261"],
            ["Malaysia", "+60"], ["Maldives", "+960"], ["Malta", "+356"], ["Mexico", "+52"],
            ["Moldova", "+373"], ["Monaco", "+377"], ["Mongolia", "+976"], ["Montenegro", "+382"],
            ["Morocco", "+212"], ["Mozambique", "+258"], ["Myanmar", "+95"], ["Nepal", "+977"],
            ["Netherlands", "+31"], ["New Zealand", "+64"], ["Nigeria", "+234"], ["North Korea", "+850"],
            ["North Macedonia", "+389"], ["Norway", "+47"], ["Oman", "+968"], ["Pakistan", "+92"],

            ["Peru", "+51"], ["Philippines", "+63"], ["Poland", "+48"], ["Portugal", "+351"],
            ["Qatar", "+974"], ["Romania", "+40"], ["Russia", "+7"], ["Saudi Arabia", "+966"],
            ["Senegal", "+221"], ["Serbia", "+381"], ["Singapore", "+65"], ["Slovakia", "+421"],
            ["Slovenia", "+386"], ["Somalia", "+252"], ["South Africa", "+27"], ["South Korea", "+82"],
            ["Spain", "+34"], ["Sri Lanka", "+94"], ["Sudan", "+249"], ["Sweden", "+46"],
            ["Switzerland", "+41"], ["Syria", "+963"], ["Taiwan", "+886"], ["Tajikistan", "+992"],
            ["Tanzania", "+255"], ["Thailand", "+66"], ["Timor-Leste", "+670"], ["Tunisia", "+216"],
            ["Turkey", "+90"], ["Turkmenistan", "+993"], ["Uganda", "+256"], ["Ukraine", "+380"],
            ["United Arab Emirates", "+971"], ["United Kingdom", "+44"], ["United States", "+1"],
            ["Uruguay", "+598"], ["Uzbekistan", "+998"], ["Venezuela", "+58"], ["Vietnam", "+84"],
            ["Yemen", "+967"], ["Zambia", "+260"], ["Zimbabwe", "+263"]
        ];

        const pilihNegara = document.getElementById("kode-negara");

        // Urutkan A sampai Z, lalu masukkan ke dropdown
        negara.sort((a, b) => a[0].localeCompare(b[0]));
        negara.forEach(([nama, kode]) => {
            const opsi = document.createElement("option");
            opsi.value = kode;
            opsi.textContent = nama + " (" + kode + ")";
            if (nama === "Indonesia") opsi.selected = true;
            pilihNegara.appendChild(opsi);
        });

        // ===== Validasi No. HP =====
        const hp = document.getElementById("hp");
        const pesanHp = document.getElementById("pesan-hp");

        hp.addEventListener("input", function () {
            if (/[^0-9]/.test(this.value)) {
                this.value = this.value.replace(/[^0-9]/g, "");
                pesanHp.textContent = "Masukkan angka, bukan huruf!";
                this.classList.add("salah");
            } else {
                pesanHp.textContent = "";
                this.classList.remove("salah");
            }
            this.setCustomValidity("");
        });

        hp.addEventListener("invalid", function () {
            this.setCustomValidity("Masukkan nomor HP berupa angka, 6 sampai 14 digit.");
        });
    </script>
</body>
</html>
